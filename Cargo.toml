[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Manos-G/fasttick"
homepage = "https://github.com/Manos-G/fasttick"
authors = ["The FastTick contributors"]

[workspace.dependencies]
# Internal crates
fasttick-core = { path = "crates/fasttick-core", version = "0.1.0" }
fasttick-protocol = { path = "crates/fasttick-protocol", version = "0.1.0" }
fasttick-log = { path = "crates/fasttick-log", version = "0.1.0" }
fasttick-testkit = { path = "crates/fasttick-testkit", version = "0.1.0" }

# Libraries
quick-xml = "0.42"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zmq = "0.10"
rmpv = "1.3"
rusqlite = { version = "0.40", features = ["bundled"] }
anyhow = "1"

# GUI
# egui's default fonts use the Ubuntu Font Licence, which is not OSI-approved.
# FastTick turns them off and bundles its own fonts (see crates/fasttick-app/assets).
egui = { version = "0.36", default-features = false, features = ["serde"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "x11", "wayland", "persistence", "accesskit"] }
egui_extras = "0.36"
egui_dock = "0.21"
rfd = "0.17"

# Tests
proptest = "1"
insta = "1"
egui_kittest = "0.36"
criterion = "0.8"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Line tables only: backtraces keep files and lines, and a debug build of
# all tests needs a few GB instead of about 20 GB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
# Smaller binaries; the symbol names stay for backtraces.
strip = "debuginfo"
