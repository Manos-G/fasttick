# cargo-about configuration. Generate the licence list with:
#   cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
# The same targets as deny.toml: FastTick ships Linux packages.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
