name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BTCPP_VERSION: "4.9.0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        # openssh: the tests of remote files run a private SSH server.
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev cppzmq-dev libsqlite3-dev cmake g++ openssh-client openssh-server
      - name: Cache BT.CPP
        id: btcpp-cache
        uses: actions/cache@v4
        with:
          path: ~/btcpp-install
          key: btcpp-${{ env.BTCPP_VERSION }}-ubuntu-24.04
      - name: Build BT.CPP
        if: steps.btcpp-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$BTCPP_VERSION" https://github.com/BehaviorTree/BehaviorTree.CPP.git ~/btcpp-src
          cmake -S ~/btcpp-src -B ~/btcpp-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/btcpp-install" -DBTCPP_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build ~/btcpp-build -j"$(nproc)"
          cmake --install ~/btcpp-build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        # The real-executor and SSH tests must run, not skip.
        run: FASTTICK_BTCPP_PREFIX="$HOME/btcpp-install" FASTTICK_REQUIRE_HARNESS=1 FASTTICK_REQUIRE_SSHD=1 cargo test --workspace

  other-platforms:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      # The real-executor and SSH tests skip here (no BT.CPP, no sshd).
      - run: cargo test --workspace --no-fail-fast

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
