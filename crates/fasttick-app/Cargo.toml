[package]
name = "fasttick-app"
description = "FastTick: a fast tree editor and debugger for BehaviorTree.CPP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fasttick_app"
path = "src/lib.rs"

[[bin]]
name = "fasttick"
path = "src/main.rs"

# Debian package: `cargo deb -p fasttick-app` (see docs/PACKAGING.md).
[package.metadata.deb]
name = "fasttick"
maintainer = "The FastTick contributors"
copyright = "The FastTick contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
FastTick is an editor, live debugger and log replayer for BehaviorTree.CPP 4 \
trees. It edits tree XML files and projects, connects to a running executor \
through the BT.CPP publisher protocol, and replays .btlog and SQLite logs."""
section = "devel"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/fasttick", "usr/bin/", "755"],
    ["packaging/fasttick.desktop", "usr/share/applications/", "644"],
    ["packaging/fasttick.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/fasttick-256.png", "usr/share/icons/hicolor/256x256/apps/fasttick.png", "644"],
    # Symbolic links to the files at the root of the repository (cargo-deb
    # cannot match paths with "..").
    ["packaging/README.md", "usr/share/doc/fasttick/", "644"],
    ["packaging/THIRD_PARTY_LICENSES.md", "usr/share/doc/fasttick/", "644"],
]

[dependencies]
fasttick-core.workspace = true
fasttick-protocol.workspace = true
fasttick-log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
egui_dock = { workspace = true, features = ["serde"] }
rfd.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
tempfile.workspace = true
# For the fake executor of the live UI tests (tests/support) and the
# end-to-end test with the real BT.CPP executor.
zmq.workspace = true
rmpv.workspace = true
fasttick-testkit.workspace = true

[lints]
workspace = true
