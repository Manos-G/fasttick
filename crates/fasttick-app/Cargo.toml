[package]
name = "fasttick-app"
description = "FastTick: a fast tree editor and debugger for BehaviorTree.CPP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fasttick_app"
path = "src/lib.rs"

[[bin]]
name = "fasttick"
path = "src/main.rs"

[dependencies]
fasttick-core.workspace = true
fasttick-protocol.workspace = true
fasttick-log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
egui_dock = { workspace = true, features = ["serde"] }
rfd.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
tempfile.workspace = true
# For the fake executor of the live UI tests (tests/support) and the
# end-to-end test with the real BT.CPP executor.
zmq.workspace = true
rmpv.workspace = true
fasttick-testkit.workspace = true

[lints]
workspace = true
